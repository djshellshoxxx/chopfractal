name: Publish Windows alpha

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-windows-alpha
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == '3b0b48f974c50ac0753082957d626bd3f2f28455' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: "38511799240"
      BUILD_SHA: "3b0b48f974c50ac0753082957d626bd3f2f28455"
      RELEASE_TAG: v0.1.0-alpha.2
    steps:
      - name: Verify the tested build
        run: |
          set -euo pipefail
          gh run watch "$BUILD_RUN" --exit-status --interval 15
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success"' run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > jobs.json
          jq -e '.jobs | any(.name == "plugin-windows" and .conclusion == "success")' jobs.json
      - name: Download and verify Windows packages
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --name chopfractal-alpha-windows --name chopfractal-standalone-windows --dir assets
          cd assets/chopfractal-alpha-windows
          sha256sum --check *.sha256
          unzip -t *.zip
          cd ../chopfractal-standalone-windows
          sha256sum --check *.sha256
          unzip -t *.zip
      - name: Publish alpha release
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Windows x64 alpha 2, built from commit 3b0b48f974c50ac0753082957d626bd3f2f28455.

          Fixes and usability changes:
          - Green Play and red Stop: local pattern playback works in the standalone app without a DAW and restarts from the beginning.
          - Long status messages wrap and scroll, and text can be selected/copied.
          - Plain click and drag selects source sections and pattern hits; Move / resize hits enables the editing gestures. Delete and M apply to selected hits together.
          - Zoom In subdivides selected pattern hits and gives a visible result or actionable error.
          - Drop an audio sample into the window to load it through the existing asynchronous decoder.
          - The standalone input-muted notice has an X button that dismisses it while preserving the feedback-loop input mute.
          - Hover help covers controls and waveform, pattern, history and Orbit views.

          Downloads:
          - Standalone ZIP: extract and run ChopFractal.exe.
          - Plugin ZIP: contains VST3 and CLAP. Install in your host's plugin folders and rescan.
          - SHA256 checksum files are included.

          First use: drop a loop (or Load Loop), Detect Chops, Generate, then Play.

          QA: the shell suite checks four essentials (real dropped sample loading, standalone Play/Stop, section selection and Zoom, embedded project save/restore), then runs at least 35 seconds of randomized editor/audio QA. The release is published only after the source CI succeeds; archive integrity and checksums are verified again before upload. See docs/QA_ALPHA2.md for the minor follow-ups, and docs/BUILD_STATUS.md for existing alpha limitations. Physical Windows audio devices and real DAW behavior still need human validation.

          Known unfinished work: input capture, advanced GUI/editor work, real DAW and CLAP host validation, installers/signing, reference-machine performance and long-duration soak testing. This remains an alpha.

          LICENSE and THIRD_PARTY_NOTICES.md are included in each ZIP.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --title "ChopFractal 0.1.0 Alpha 2 — Windows" --notes-file notes.md --prerelease --draft
          fi
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish | jq -e --arg sha "$BUILD_SHA" '.targetCommitish == $sha'
          gh release upload "$RELEASE_TAG" assets/chopfractal-alpha-windows/* assets/chopfractal-standalone-windows/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

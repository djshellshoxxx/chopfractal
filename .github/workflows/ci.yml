name: CI

# Pull requests run the fast gate: repository checks, GCC and Clang, sanitizers, the transfer smoke test and the Linux
# plugin (build, shell tests, validator). Pushes to main, the nightly schedule and manual runs add the slow platform
# jobs: macOS and Windows portable tests and the full package matrix (Windows, macOS arm64/x86_64/universal).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "**/*.png", "**/*.jpg", "**/*.svg", "IP/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "**/*.png", "**/*.jpg", "**/*.svg", "IP/**", "LICENSE*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portability protocol: manifests, dependency graph, includes, forbidden host/GUI headers, current docs.
  portability:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_modules.py
      - run: python3 tools/gen_module_docs.py --check
      # Standard headers must be included directly, not inherited from one compiler's library internals.
      - run: python3 tools/check_includes.py
      # Forbidden stretch engines (GPL/LGPL/commercial): docs/specs/roadmap/F14-tempo-match-stretch.md section 6.
      - name: No forbidden time-stretch libraries
        run: '! grep -rIliE "rubberband|soundtouch|elastique" --include=CMakeLists.txt --include=*.cmake --include=*.hpp --include=*.cpp --include=module.json modules composition plugin tools'
      - run: python3 tools/check_version.py
      - run: python3 -I tools/tests/test_packaging.py

  # Every module and the composition root, on each supported compiler/OS. The golden determinism hashes in
  # pattern_engine make a cross-platform divergence fail loudly here.
  build-test:
    timeout-minutes: 60
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # jobs: about one compile job per 2 GB of runner RAM (ubuntu-24.04 and windows-2022: 4 cores/16 GB,
        # macos-14: 3 cores/7 GB). The macOS and MSVC rows repeat the same tests on another OS, so they run only on
        # main, nightly and manual runs (the golden hashes still catch a cross-platform divergence there).
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"linux-gcc","os":"ubuntu-24.04","cc":"gcc","cxx":"g++","werror":"ON","jobs":4},{"name":"linux-clang","os":"ubuntu-24.04","cc":"clang","cxx":"clang++","werror":"ON","jobs":4}]' || '[{"name":"linux-gcc","os":"ubuntu-24.04","cc":"gcc","cxx":"g++","werror":"ON","jobs":4},{"name":"linux-clang","os":"ubuntu-24.04","cc":"clang","cxx":"clang++","werror":"ON","jobs":4},{"name":"macos-arm64","os":"macos-14","cc":"clang","cxx":"clang++","werror":"ON","jobs":3},{"name":"windows-msvc","os":"windows-2022","cc":"cl","cxx":"cl","werror":"OFF","jobs":4}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHOPFRACTAL_WARNINGS_AS_ERRORS=${{ matrix.werror }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel ${{ matrix.jobs }}

  sanitizers:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer + UBSan over everything
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build-asan -G Ninja -DCHOPFRACTAL_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-asan --parallel 4
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-asan --output-on-failure --parallel 4
      - name: ThreadSanitizer on the real-time renderer and its lock-free mailbox
        run: |
          cmake -S modules/audio_renderer -B build-tsan -G Ninja -DCMAKE_CXX_FLAGS="-fsanitize=thread -O1 -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --target test_audio_renderer --parallel 4
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan/test_audio_renderer
      - name: ThreadSanitizer on the input capture module (audio thread vs. status, stop and take)
        run: |
          cmake -S modules/input_capture -B build-tsan-ic -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan-ic --target test_input_capture --parallel 4
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan-ic/test_input_capture
      - name: ThreadSanitizer on the time-stretch module (threaded determinism test)
        run: |
          cmake -S modules/time_stretch -B build-tsan-ts -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan-ts --target test_time_stretch --parallel 4
          TSAN_OPTIONS=halt_on_error=1 ./build-tsan-ts/test_time_stretch

  # Each module copied with only its declared dependencies into an empty project must build and pass.
  transfer-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: tools/smoke_transfer.sh

  # The JUCE shell: Standalone + VST3 + CLAP. Pull requests build Linux x86_64 only; main, nightly and manual runs
  # build Windows x64, Linux x86_64, macOS arm64 and macOS x86_64 (plus a macOS universal merge). Runs the headless shell tests on each, the Steinberg validator on Linux,
  # and uploads one zip/tar.gz per platform and format (14 day retention). See .github/workflows/build-packages.yml.
  packages:
    uses: ./.github/workflows/build-packages.yml
    with:
      release: false
      retention-days: 14
      full: ${{ github.event_name != 'pull_request' }}
